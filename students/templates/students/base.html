<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Registration{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f4f7fb;color:#202b3c;font-family:Arial,sans-serif}
    .navbar{background:#15243b}.navbar-brand{font-weight:700;letter-spacing:.2px}
    .hero{background:linear-gradient(120deg,#2458d3,#6d5ce7);color:white;border-radius:18px;padding:26px}
    .panel{border:0;border-radius:16px;box-shadow:0 8px 28px rgba(20,40,80,.08)}
    .btn-primary{background:#3159d9;border-color:#3159d9}
    .table thead th{background:#eef2ff;color:#293b70;white-space:nowrap}
    .form-label{font-weight:600}.footer{color:#758198;font-size:.9rem}
  </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="{% url 'student_list' %}">🎓 Student Registration</a>
    <a class="btn btn-sm btn-outline-light" href="{% url 'student_create' %}">+ Register Student</a>
  </div>
</nav>
<main class="container py-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{ message }} <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
  <div class="text-center mt-4 footer">Django · SQLite · Bootstrap 5</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% extends "students/base.html" %}
{% block title %}Delete Student{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card panel border-top border-danger border-4">
      <div class="card-body p-4">
        <h1 class="h4">Delete student record?</h1>
        <p>Are you sure you want to delete <strong>{{ student.full_name }}</strong> ({{ student.enrollment_no }})? This action cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <button class="btn btn-danger" type="submit">Yes, delete</button>
          <a class="btn btn-outline-secondary" href="{% url 'student_list' %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
